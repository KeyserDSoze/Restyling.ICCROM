name: Deploy ICCROM concept to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Derive preview password hashes
        id: password
        shell: bash
        env:
          PASSWORD_UI: ${{ secrets.password_ui }}
          PASSWORD_UI_2: ${{ secrets.password_ui_2 }}
        run: |
          if [ -z "$PASSWORD_UI" ]; then
            echo "The password_ui repository secret is required." >&2
            exit 1
          fi
          if [ -z "$PASSWORD_UI_2" ]; then
            echo "The password_ui_2 repository secret is required." >&2
            exit 1
          fi
          echo "hash=$(printf '%s' "$PASSWORD_UI" | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "hash_2=$(printf '%s' "$PASSWORD_UI_2" | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Build static site
        env:
          VITE_UI_PASSWORD_HASH: ${{ steps.password.outputs.hash }}
          VITE_UI_PASSWORD_HASH_2: ${{ steps.password.outputs.hash_2 }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
