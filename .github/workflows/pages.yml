name: Deploy ICCROM concept to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare supplied static mockups
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="mockups/ICCROM-static-mockups-package.zip"
          ORIGINAL="mockups/ICCROM 1.zip"
          rm -rf public/mockups
          mkdir -p public/mockups

          if [ -f "$PACKAGE" ]; then
            rm -rf /tmp/iccrom-static-package
            mkdir -p /tmp/iccrom-static-package
            unzip -q "$PACKAGE" -d /tmp/iccrom-static-package
            python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import shutil

          package = Path('/tmp/iccrom-static-package')
          target = Path('public/mockups')
          manifest = json.loads((package / 'manifest.json').read_text(encoding='utf-8'))

          for item in manifest['files']:
              source = package / 'blobs' / item['sha256']
              data = source.read_bytes()
              if hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise RuntimeError(f"Checksum mismatch for {item['path']}")
              destination = target / item['path']
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          PY
            echo "VITE_STATIC_MOCKUPS=1" >> "$GITHUB_ENV"
            echo "Prepared four supplied static mockups from deduplicated package."
          elif [ -f "$ORIGINAL" ]; then
            rm -rf /tmp/iccrom-original
            mkdir -p /tmp/iccrom-original
            unzip -q "$ORIGINAL" -d /tmp/iccrom-original
            cp -a "/tmp/iccrom-original/ICCROM/mockup/." "public/mockups/horizon/"
            cp -a "/tmp/iccrom-original/ICCROM/mockup-v2/." "public/mockups/chapters/"
            cp -a "/tmp/iccrom-original/ICCROM/mockup-v3/." "public/mockups/mosaic/"
            cp -a "/tmp/iccrom-original/ICCROM/mockup-v4/." "public/mockups/patina/"
            echo "VITE_STATIC_MOCKUPS=1" >> "$GITHUB_ENV"
            echo "Prepared four supplied static mockups from original archive."
          else
            echo "VITE_STATIC_MOCKUPS=0" >> "$GITHUB_ENV"
            echo "Static mockup package not present; keeping the three React experiences only."
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Derive preview password hashes
        id: password
        shell: bash
        env:
          PASSWORD_UI: ${{ secrets.password_ui }}
          PASSWORD_UI_2: ${{ secrets.password_ui_2 }}
        run: |
          if [ -z "$PASSWORD_UI" ]; then
            echo "The password_ui repository secret is required." >&2
            exit 1
          fi
          if [ -z "$PASSWORD_UI_2" ]; then
            echo "The password_ui_2 repository secret is required." >&2
            exit 1
          fi
          echo "hash=$(printf '%s' "$PASSWORD_UI" | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "hash_2=$(printf '%s' "$PASSWORD_UI_2" | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Build static site
        env:
          VITE_UI_PASSWORD_HASH: ${{ steps.password.outputs.hash }}
          VITE_UI_PASSWORD_HASH_2: ${{ steps.password.outputs.hash_2 }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
